continuity: "retained"
verdict: "reorder"
current_rationale: "The accepted active-slice lifecycle satisfies the bounded recovery prerequisite for planning and review obligations, and the first dedicated Git-backed proposal-packet contract now establishes stable identity and deterministic repository validation. Interactive formation, adaptive review, and authority-controlled decisions remain later consumers rather than hidden scope in the packet foundation."
assumptions:
  confirmed:
    - evidence: "accepted durable live-state handoffs and reachable fresh-process active-slice lifecycle at repository revision 29b5ec969a0f27eb4881e8b7abfb9687e645dc7d"
      consequence: "Slice-supervisor owns recoverable planning/review obligation semantics over an opaque durable-state compare-and-swap primitive; the proposal workflow recovery prerequisite is satisfied without transferring proposal ownership into runtime state."
    - evidence: "proposals/idea-to-proposal-system"
      consequence: "Durable proposal packets and interactive proposal formation already have formed candidate boundaries and can become the immediate consumer of the state foundation."
  changed:
    - evidence: "Explicit user priority decision on 2026-08-21"
      consequence: "Reaching a usable proposal workflow now precedes installed-skill distribution, broader repository release work, evidence-backed portfolio evaluation, and closed-loop learning."
    - evidence: "ideas/architectural-review.md, ideas/persistent-strategic-planner.md, and proposal-review planning"
      consequence: "Architectural review and strategic planning should be reusable capabilities during both proposal design and implementation, with phase-specific authority, evidence, context, and output projections."
    - evidence: "Adaptive specialized-review decision recorded in ideas/adaptive-specialized-review-panels.md"
      consequence: "Proposal review is a consequence-driven panel of selected specialist capabilities with a non-authoritative decision-readiness gate, not one universal reviewer or a fixed reviewer roster."
  invalidated:
    - evidence: "Accepted review-coordination and persistent-state remediation"
      consequence: "The initial state boundary does not require a complete review queue, reservation system, event-sourced history, decision graph, or Work Dossier."
    - evidence: "Explicit review authority decision"
      consequence: "Durability of a role judgment does not make that judgment correct, authoritative, or independent evidence for itself."
route_changes:
  priorities:
    - "Preserve the accepted active-slice recovery boundary as the proposal workflow prerequisite."
    - "Preserve and exercise the minimal durable proposal-packet contract as a dedicated planning-layer capability with stable identity, human-readable meaning, typed relationships, uncertainty, authority metadata, and deterministic validation."
    - "Implement interactive proposal formation only after the packet target is proven; do not make formation part of packet identity ownership."
    - "Include revision-bound adaptive specialized review and explicit authority-controlled decision transitions in the first controlled proposal lifecycle."
    - "Dogfood the workflow on materially different ideas before selecting further idea-driven implementation."
  dependencies:
    - "Reliable interactive proposal continuation depends on a named durable owner for resume-critical live state."
    - "Interactive formation depends on a durable packet target with stable identity, lineage, placement, relationships, uncertainty, and authority metadata."
    - "Proposal review depends on immutable proposal-revision identity, read-only reviewer artifacts, applicability lineage, and a synthesis boundary that cannot mutate or accept the proposal."
  newly_important:
    - "Architectural diagnosis separated from architecture mutation and scope-reopening authority."
    - "Strategic advice separated from campaign amendment and portfolio-decision authority."
    - "Model-selected specialist review panels based on material claims, seams, uncertainty, and explicit contracts."
    - "Review selection and omission provenance proportionate to decision value rather than administrative completeness."
    - "A durable-judgment rule: persistence preserves provenance, not epistemic or decision authority."
  deferred:
    - "Evidence-backed scoring, normalization, and portfolio ranking."
    - "Full role-decision graph, Work Dossier service, confidence calibration, and introspection UI."
    - "Automatic reviewer-selection rules, fixed reviewer rosters, or mandatory universal review phases."
    - "General scheduling, mutation reservations, and review-queue infrastructure unless later evidence establishes a required consumer."
recommended_campaign:
  disposition: "start_new"
  objective: "Establish the minimal durable proposal-packet contract and mechanically prove stable identity, local references, typed relationships, uncertainty, and authority metadata without conflating proposal meaning with runtime state"
  work_source: "proposals/idea-to-proposal-system/durable-proposal-packets"
  reason: "The live-state prerequisite is accepted; the packet contract is the next independently useful consumer and does not preselect formation UX, review panels, portfolio evaluation, runtime wiring, or coordination machinery."
open_uncertainties:
  - "Whether adaptive review selection and synthesis belong to one proposal-review coordinator or separate review-planning and synthesis capabilities."
  - "Whether architectural review remains one capability with phase-specific projections or later evidence justifies distinct proposal-architecture and implementation-architecture roles."
authority_required: []
revisit_when:
  - "The proposal-packet contract is exercised by interactive formation or another real consumer."
  - "Proposal-packet dogfooding reveals missing lifecycle, review-applicability, or authority semantics."
  - "Specialist-review use shows that the proposed open capability registry is either insufficiently expressive or becoming a procedural taxonomy."
