version: 2
objective: "Implement the approved agent-instruction structure and placement review proposal as one bounded slice, including independent bootstrap review and real dogfood on agent-facing instruction surfaces"

work_source:
  kind: file
  value: "proposals/agent-instruction-integrity/agent-instruction-structure-placement-review/implementation-authorization.md"

builder:
  skill: "slice-builder"
  context:
    repository_evidence:
      skill: "repo-search"
      provider: "codex-codebase-memory"
    adversarial_review:
      provider: "codex"
      skill: "codex-adversarial-review"
      model: "gpt-6-astra"
      reasoning_effort: "high"
      evidence_class: "accepted_same_provider_different_model_review"
      isolation: "fresh_process"

validation:
  profile: "engineering-proportional"
  requirements:
    - semantic_proof
    - risk_proportional_checks
    - workspace_integrity

metrics:
  path: "metrics/agent-instruction-review.jsonl"

limits:
  slices: 1

approval:
  plan: "procedural_when_safe"
  uninterrupted_after_plan: false

notifications:
  intervention: true
  completion: false

slice_completion_commit:
  prompt: enabled

amendments:
  - timestamp: "2026-08-23T16:34:00-06:00"
    changed_fields:
      - "builder.context.independent_review"
      - "builder.context.adversarial_review"
    prior_values:
      builder.context.independent_review:
        provider: "claude"
        skill: "claude-recon-implementation"
    new_values:
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-5.6-sol"
        reasoning_effort: "low"
        evidence_class: "accepted_same_model_review"
        isolation: "fresh_process"
    reason: "Claude returned a session-limit error before review; the user explicitly authorized Codex Sol/low for this specific review."
    human_approval: "I approve a codex Sol low reviewer for this specific review. please proceed."
  - timestamp: "2026-10-27T15:38:49-06:00"
    changed_fields:
      - "builder.model"
      - "builder.reasoning_effort"
      - "builder.context.adversarial_review"
    prior_values:
      builder.model: "gpt-5.6-sol"
      builder.reasoning_effort: "low"
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-5.6-sol"
        reasoning_effort: "low"
        evidence_class: "accepted_same_model_review"
        isolation: "fresh_process"
    new_values:
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-6-astra"
        reasoning_effort: "xhigh"
        evidence_class: "accepted_same_provider_different_model_review"
        isolation: "fresh_process"
    reason: "gpt-5.6-sol is no longer a supported builder or reviewer model, so preflight rejected this campaign. builder.model and builder.reasoning_effort are removed so the campaign builder default applies: gpt-6.1-terra at medium on this date (docs/model-selection.md). The reviewer becomes gpt-6-astra at xhigh, the guide's OpenAI adversarial reviewer; the evidence class becomes different-model because builder and reviewer models now differ."
    human_approval: "\"Align them to the guide\" (2026-10-27, on model choices encoded in skills); \"yeah, let's remove gpt-5.6-sol; please push\" (2026-10-27)"
  - timestamp: "2026-10-27T16:12:35-06:00"
    changed_fields:
      - "builder.context.adversarial_review"
    prior_values:
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-6-astra"
        reasoning_effort: "xhigh"
        evidence_class: "accepted_same_provider_different_model_review"
        isolation: "fresh_process"
    new_values:
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-6-astra"
        reasoning_effort: "high"
        evidence_class: "accepted_same_provider_different_model_review"
        isolation: "fresh_process"
    reason: "docs/model-selection.md now sets the OpenAI adversarial reviewer to gpt-6-astra at high, with xhigh only for architecture, ownership-contract or open-design subjects; this campaign's reviewer follows the high default, and reviewing such a subject at xhigh needs its own amendment."
    human_approval: "\"ok, let's change that at model guidance level\" (2026-10-27)"

stop_on:
  - objective_complete
  - human_judgment
  - unresolved_architecture
  - quota_exhaustion
  - validation_nonconvergence
