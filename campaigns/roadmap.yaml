version: 2
objective: "Advance the Work Engine roadmap"

work_source:
  kind: file
  value: "roadmap.md"

builder:
  skill: "slice-builder"
  context:
    repository_evidence:
      skill: "repo-search"
      provider: "codex-codebase-memory"
    independent_review:
      skill: "claude-recon-implementation"
      provider: "claude"

validation:
  profile: "engineering-proportional"
  requirements:
    - semantic_proof
    - risk_proportional_checks
    - workspace_integrity

limits: {}

approval:
  plan: "procedural_when_safe"
  uninterrupted_after_plan: false

notifications:
  intervention: true
  completion: false

stop_on:
  - objective_complete
  - human_judgment
  - unresolved_architecture
  - quota_exhaustion
  - validation_nonconvergence

metrics:
  path: "metrics/work-engine-roadmap.jsonl"

capabilities:
  chrome_vision:
    config: chrome-vision.yaml

amendments:
  - timestamp: "2026-10-27T15:38:49-06:00"
    changed_fields:
      - "builder.model"
      - "builder.reasoning_effort"
    prior_values:
      builder.model: "gpt-5.6-sol"
      builder.reasoning_effort: "low"
    new_values: {}
    reason: "gpt-5.6-sol is no longer a supported builder or reviewer model, so preflight rejected this campaign. builder.model and builder.reasoning_effort are removed so the campaign builder default applies: gpt-6.1-terra at medium on this date (docs/model-selection.md)."
    human_approval: "\"Align them to the guide\" (2026-10-27, on model choices encoded in skills); \"yeah, let's remove gpt-5.6-sol; please push\" (2026-10-27)"
