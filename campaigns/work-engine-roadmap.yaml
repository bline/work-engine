version: 1
objective: "Advance the work-engine roadmap"

work_source:
  kind: file
  value: "work-engine/roadmap.md"

builder:
  skill: "slice-builder"
  model: "gpt-5.6-sol"
  reasoning_effort: "low"
  context:
    evidence_skill: "claude-recon-implementation"
    reconnaissance:
      provider: "claude-codebase-memory"

validation:
  profile: "engineering-full"
  requirements:
    - focused_checks
    - full_suite
    - freshness_checks
    - adversarial_review

limits: {}

approval:
  plan: "procedural_when_safe"
  uninterrupted_after_plan: false

notifications:
  intervention: true
  completion: false

stop_on:
  - objective_complete
  - human_judgment
  - unresolved_architecture
  - quota_exhaustion
  - validation_nonconvergence

metrics:
  path: "work-engine/metrics/work-engine-roadmap.jsonl"
