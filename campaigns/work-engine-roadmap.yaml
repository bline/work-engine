version: 2
objective: "Advance the work-engine roadmap"

work_source:
  kind: file
  value: "work-engine/roadmap.md"

builder:
  skill: "slice-builder"
  model: "gpt-5.6-sol"
  reasoning_effort: "low"
  context:
    repository_evidence:
      skill: "repo-search"
      provider: "codex-codebase-memory"
    independent_review:
      skill: "claude-recon-implementation"
      provider: "claude"

validation:
  profile: "engineering-proportional"
  requirements:
    - semantic_proof
    - risk_proportional_checks
    - workspace_integrity

limits: {}

approval:
  plan: "procedural_when_safe"
  uninterrupted_after_plan: false

notifications:
  intervention: true
  completion: false

stop_on:
  - objective_complete
  - human_judgment
  - unresolved_architecture
  - quota_exhaustion
  - validation_nonconvergence

metrics:
  path: "work-engine/metrics/work-engine-roadmap.jsonl"

capabilities:
  chrome_vision:
    config: ../config/chrome-vision.yaml
