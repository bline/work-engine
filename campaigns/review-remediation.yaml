version: 2
objective: "Remediate the verified completion-commit defects and doctrine-alignment issues recorded in planning/review-remediation/README.md without prescribing non-invariant implementation routes."

work_source:
  kind: file
  value: "planning/review-remediation/README.md"

builder:
  skill: "slice-builder"
  model: "gpt-5.6-sol"
  reasoning_effort: "low"
  context:
    repository_evidence:
      skill: "repo-search"
      provider: "codex-codebase-memory"
    adversarial_review:
      provider: "codex"
      skill: "codex-adversarial-review"
      model: "gpt-5.6-sol"
      reasoning_effort: "low"
      evidence_class: "accepted_same_model_review"
      isolation: "fresh_process"

validation:
  profile: "engineering-proportional"
  requirements:
    - semantic_proof
    - risk_proportional_checks
    - workspace_integrity

metrics:
  path: "metrics/review-remediation.jsonl"

limits: {}

approval:
  plan: "procedural_when_safe"
  uninterrupted_after_plan: false

notifications:
  intervention: true
  completion: false

slice_completion_commit:
  prompt: disabled

amendments:
  - timestamp: "2026-08-21T00:00:00-06:00"
    changed_fields:
      - "builder.context.independent_review"
      - "builder.context.adversarial_review"
    prior_values:
      builder.context.independent_review:
        provider: "claude"
        skill: "claude-recon-implementation"
    new_values:
      builder.context.adversarial_review:
        provider: "codex"
        skill: "codex-adversarial-review"
        model: "gpt-5.6-sol"
        reasoning_effort: "low"
        evidence_class: "accepted_same_model_review"
        isolation: "fresh_process"
    reason: "Claude quota was unavailable; the user accepted fresh-process same-model review without an independence claim."
    human_approval: "I approve. Please use Sol as the reviewer and label it as accepted same-model review and ensure we record the model and reasoning level."

stop_on:
  - objective_complete
  - human_judgment
  - unresolved_architecture
  - quota_exhaustion
  - validation_nonconvergence
