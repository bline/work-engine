preregistration_owner: Human-authorized v2 slice executed by Codex; immutable checkpoint required before any model job.
limitations:
  - The same Sol model family renders, adjudicates, and matches; repetitions estimate execution stability, not independent reliability.
  - Licensed cards are experimental refinements of provisional two-document profiles and may reduce or alter authentic-register recognizability.
  - All-sample adjudication improves calibration but is one same-family judgment, not independent semantic certification.
  - This is an upstream selection probe, not the C0/C1/C2 manipulation check or behavioral trial.
  - Passing does not select a corpus or authorize production integration without human acceptance.
