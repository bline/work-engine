briefs:
  - brief_id: cache-canary
    context: Produce a compact technical review decision using only the following exact meanings.
    required_propositions:
      - id: cache-change
        meaning: The proposed update changes a cache lifetime from five minutes to fifteen minutes.
      - id: cache-evidence
        meaning: A twenty-four-hour benchmark observed eighteen percent fewer origin requests.
      - id: cache-positive-evaluation
        meaning: The reduction in origin requests is operationally promising.
      - id: cache-limit
        meaning: The benchmark did not measure stale-read incidence.
      - id: cache-bounded-contrast
        meaning: The evidence supports a limited experiment but does not support broad rollout.
      - id: cache-decision
        meaning: Approve only a canary deployment and require stale-read telemetry before broader rollout.
    required_speech_act: A bounded approval recommendation that preserves both the promising result and the explicit evidence limit.
    output_constraint: One self-contained paragraph of 90 to 130 words with no heading, bullet list, or serialized wrapper.
  - brief_id: alias-removal
    context: Produce a compact technical review decision using only the following exact meanings.
    required_propositions:
      - id: alias-change
        meaning: A migration renamed three public fields while retaining compatibility aliases.
      - id: alias-evidence
        meaning: Twelve of fourteen known clients have migrated; the status of two clients is unknown.
      - id: alias-positive-evaluation
        meaning: Migrating twelve known clients is substantial progress.
      - id: alias-limit
        meaning: Integration tests cover the twelve migrated clients but not the two clients of unknown status.
      - id: alias-bounded-contrast
        meaning: The evidence supports continued migration work but does not support removing the aliases.
      - id: alias-decision
        meaning: Do not remove the aliases until the two remaining client owners confirm migration.
    required_speech_act: A bounded rejection recommendation that preserves both the substantial progress and the explicit evidence limit.
    output_constraint: One self-contained paragraph of 90 to 130 words with no heading, bullet list, or serialized wrapper.
candidate_styles:
  - condition_id: gelman-model-criticism
    profile:
      path: skills/linguistic-register-pilot/pilot/candidates/gelman-model-criticism/profile.yaml
      sha256: 60b645cc5b04c7d7a32dd314406e374bb9c31959903756db0201f67414d98be8
    features:
      - source_feature_id: symmetric-opposition
        layer: surface
        category: contrast_patterns
        salience_weight: 4
        licensed_instruction: Present the brief's explicitly positive evaluation and evidence limit as two concerns in tension before resolving them with the bounded contrast.
      - source_feature_id: first-person-epistemic-positioning
        layer: surface
        category: claim_posture
        salience_weight: 3
        licensed_instruction: State the recommendation in a direct first-person epistemic posture without changing its strength.
      - source_feature_id: numbered-response-structure
        layer: surface
        category: paragraph_rhythm
        salience_weight: 3
        licensed_instruction: Use compact pointwise sequencing inside the single paragraph without headings, bullets, or new categories.
      - source_feature_id: partial-agreement-before-boundary
        layer: discourse
        category: qualification_patterns
        salience_weight: 4
        licensed_instruction: Acknowledge the brief's positive evaluation before identifying the exact evidence boundary already stated in the brief.
      - source_feature_id: compact-summary-after-elaboration
        layer: surface
        category: conclusion_patterns
        salience_weight: 3
        licensed_instruction: End by compressing the brief's bounded contrast into a short parallel restatement without adding a slogan or premise.
  - condition_id: leveson-system-safety
    profile:
      path: skills/linguistic-register-pilot/pilot/candidates/leveson/profile.yaml
      sha256: 86b31811b89e1d9bfd97aac43778ba5a1db8e8c0a9717002da1f5019e69b7a71
    features:
      - source_feature_id: contrastive-reframing
        layer: surface
        category: connective_patterns
        salience_weight: 4
        licensed_instruction: State the brief's broader pro-action interpretation, then replace it immediately with the more precisely bounded conclusion; do not call either framing familiar, conventional, or widely held.
      - source_feature_id: enumerated-consequence-ladders
        layer: surface
        category: paragraph_rhythm
        salience_weight: 3
        licensed_instruction: Move in a compact consequence sequence from evidence, to stated limitation, to the already specified practical decision without headings or bullets.
      - source_feature_id: direct-evaluative-declaratives
        layer: surface
        category: claim_posture
        salience_weight: 4
        licensed_instruction: State the brief's exact positive evaluation and central decision in short high-commitment declarative sentences, then give the stated limit.
      - source_feature_id: scoped-concession-boundaries
        layer: discourse
        category: qualification_patterns
        salience_weight: 3
        licensed_instruction: Make clear that the evidence limit blocks only the broader action named in the brief and does not negate the exact positive evaluation.
      - source_feature_id: visible-reader-cues
        layer: surface
        category: connective_patterns
        salience_weight: 2
        licensed_instruction: Use a brief reader-facing cue to announce the bounded contrast before explaining it, without asserting importance beyond the brief.
  - condition_id: shaw-engineering-judgment
    profile:
      path: skills/linguistic-register-pilot/pilot/candidates/shaw-engineering-judgment/profile.yaml
      sha256: 54b8cd476174e01acc50cdf19784d7a3cf70852bb3239311d85ef8e7abe7d4d4
    features:
      - source_feature_id: parallel-guiding-questions
        layer: surface
        category: paragraph_rhythm
        salience_weight: 4
        licensed_instruction: Introduce the decision through a short parallel series of questions answerable only by the brief's six propositions.
      - source_feature_id: neutral-progression-connectives
        layer: surface
        category: connective_patterns
        salience_weight: 3
        licensed_instruction: Progress with restrained connectives from observation, to the brief's bounded contrast, to its resulting decision.
      - source_feature_id: compact-parallel-categories
        layer: surface
        category: syntax
        salience_weight: 3
        licensed_instruction: Place the brief's observed result, positive evaluation, and unmeasured or unknown limit in compact parallel grammatical forms without inventing a taxonomy.
      - source_feature_id: consequence-first-conditionals
        layer: discourse
        category: conclusion_patterns
        salience_weight: 3
        licensed_instruction: State the brief's practical decision first, then explain it using only the supplied evidence, evaluation, and limit.
      - source_feature_id: restrained-evaluative-calibration
        layer: discourse
        category: qualification_patterns
        salience_weight: 4
        licensed_instruction: "Preserve the exact evidential maturity encoded by the brief: promising or substantial progress, but insufficient support for the broader action."
