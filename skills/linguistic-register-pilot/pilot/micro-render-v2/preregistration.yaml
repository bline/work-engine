semantic_license:
  invariant: Every condition receives the same six meanings and speech act for a brief; a style feature may only order, connect, attribute, parallelize, question, qualify, or restate those meanings.
  prohibited_additions: Do not invent familiarity, consensus, opposing stakeholders, importance, risk magnitude, method adequacy beyond the named action, new evidence, new requirements, analogies with substantive implications, or any evaluation not explicitly supplied.
rendering:
  replicas_per_brief_condition: 2
  seed: frozen-before-outcomes::semantic-licensed-v2::2026-08-25
  task: Express each of the six meanings exactly once, preserve the speech act, and naturally realize only the anonymous licensed style instructions.
  blindness: One renderer receives one anonymous licensed style card and one brief, with no condition identity, source, hypothesis, other card, prior output, or answer key.
semantic_adjudication:
  task: Apply one decision standard across all sixteen brief/text pairs; map every proposition, detect alteration or added meaning, and judge speech-act equivalence.
  blindness: The adjudicator receives all brief/text pairs for calibration but no style cards, conditions, source identities, original renderer labels, hypothesis, or answer key.
  equivalence_rule: Equivalent requires all six propositions preserved, the speech act preserved, and no added meaning. Apply identical treatment to identical evaluative or connective language across samples.
matching:
  task: Match each accepted text to the anonymous licensed style card whose linguistic realization it expresses most strongly.
  blindness: Each matcher receives four randomized anonymous reference cards and sixteen randomized accepted texts, with no briefs, conditions, source identities, answer key, prior pass, or intended winner.
  score_scale: Confidence 1 is a forced guess, 3 is a narrow reliable match, and 5 requires multiple independent realization cues.
  passes: 3
thresholds:
  require_all_semantically_equivalent: true
  minimum_correct_assignments_per_condition: 9
  minimum_passing_match_passes_per_condition: 2
  minimum_correct_per_condition_in_passing_pass: 3
