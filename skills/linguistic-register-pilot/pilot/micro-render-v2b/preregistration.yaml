transport:
  completeness_gate: All sixteen expected render jobs must have a retained attempt marker, successful receipt, and accepted normalized prose before semantic adjudication is permitted.
  blinded_ingestion: Ingestion records sample ID and transport result only. Candidate and condition identities remain in the sealed render key until post-batch evidence is checkpointed.
  direct_string: Accept the unchanged nonempty text field when it is prose and satisfies the frozen paragraph and word-count constraint.
  approved_wrapper: Unwrap exactly once only when the text field is exact JSON for an object with the single key text and a nonempty string value; accept that value unchanged if it is not another serialized wrapper and satisfies the prose constraint.
  rejection_rule: Reject extra keys, arrays, code fences, malformed JSON-looking text, non-string values, second nested wrappers, and prose outside the frozen paragraph or word-count constraint.
  digest_rule: Preserve SHA-256 digests of the raw model response and extracted prose, plus direct, unwrapped_once, or rejected status, without treating transport metadata as recognizability evidence.
launch:
  manifest_rule: Before any model job, retain one immutable manifest binding all expected job IDs to packet, schema, prompt, model, reasoning effort, and canonical request digest.
  attempt_rule: Write one immutable attempt marker containing experiment ID, job ID, canonical request digest, configuration, and timestamp before spawning each Sol process.
  receipt_rule: Retain raw response, raw digest, provider metadata, completion status, and event digest for every attempted job, including failed jobs when the launcher returns.
  batch_rule: After the batch and blinded ingestion, immediately checkpoint expected, attempted, completed, rejected, and explicitly missing jobs before semantic adjudication or aggregate interpretation.
thresholds:
  expected_render_jobs: 16
  require_transport_complete: true
downstream_authority:
  semantic_adjudication: Authorized only if the transport-completeness gate passes in the immediate post-batch checkpoint.
  matching: Authorized only if transport completeness and the base plan's all-sample semantic-equivalence gate both pass.
