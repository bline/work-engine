hypotheses:
  H1: The treatment changes propagated output register without a practically meaningful
    behavioral difference from C0. The pilot cannot establish equivalence by non-significance.
  H2: C2 improves proximal Family A judgment without a matched-polarity loss and without
    a corresponding Family B signal.
  H3_candidate: C2 improves calibrated Family B response, including B1 resistance
    without B2 revision loss, across both renderings.
