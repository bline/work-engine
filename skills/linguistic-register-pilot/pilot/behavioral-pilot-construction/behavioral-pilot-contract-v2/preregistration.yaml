preoutcome_gates:
- exact contract and upstream digest validation
- exact sequential model-visible task turns bound through keys and schedule
- six immutable rendering digests
- canonical coverage and semantic equivalence for all six artifacts
- speech-act equivalence and salience control
- actual-artifact manipulation by intended dimensions
- no sufficient single-feature or shallow-format cue
- exact subject prelaunch verification
- no prior outcome-bearing files
interpretation_limits:
- The 48 trials are exploratory and not powered for confirmatory mixed-effects inference.
- Non-significance is not evidence of equivalence or H1.
- Model rationale is not a faithful mechanistic trace.
- Output register uptake is not behavioral task quality.
- A signal without snapshot pinning is not stable across model versions or time.
