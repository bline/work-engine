  name: slice-supervisor
  description: Run a declaratively configured, evidence-driven work campaign through bounded slices,
    explicit plan acceptance, configured builder and validation gates, durable receipts, limits,
    notifications, and truthful stop decisions. Use when Codex must autonomously advance a roadmap,
    cleanup plan, performance campaign, or other multi-slice objective without absorbing worker
    context into the parent session.
