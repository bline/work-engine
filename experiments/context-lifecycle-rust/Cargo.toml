[package]
name = "context-lifecycle-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
schemars = "1.2"
tempfile = "3"
