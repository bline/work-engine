[workspace]
resolver = "3"
members = [
  "crates/work-engine-query",
  "crates/work-engine-command",
  "crates/session-task-admission",
  "crates/session-delivery",
  "crates/session-query",
  "crates/work-engine-server",
  "crates/session-bridge",
  "crates/mcp-auth",
  "crates/review-workflow",
  "crates/work-engine-review-host",
  "crates/work-engine-types",
  "crates/lifecycle-core",
  "crates/lifecycle-store",
  "crates/lifecycle-semantic",
  "crates/lifecycle-admin",
  "crates/lifecycle-runtime",
  "crates/lifecycle-provider",
  "crates/lifecycle-codex",
  "crates/lifecycle-wire",
  "crates/lifecycle-client",
  "crates/lifecycle-service",
  "crates/lifecycle-test-support",
  "crates/retained-task-workflow",
  "crates/work-engine-task-host",
  "crates/lifecycle-proof",
  "crates/work-engine-compiler",
  "crates/work-engine-compiler-cli",
  "crates/review-episode-core",
  "crates/review-episode-store",
  "crates/review-episode",
  "crates/claim-evidence",
  "crates/work-engine-claims-host",
  "crates/repository-evidence-cbm",
  "crates/repository-claims-handoff",
  "crates/review-execution-custody",
  "crates/review-execution-evidence",
  "crates/slice-campaign",
  "crates/workspace-publication",
  "crates/work-engine-completion-host",
  "crates/work-engine-context-status",
  "crates/work-engine-manual-host",
  "crates/experiment-control",
  "crates/bounded-inference",
  "crates/lifecycle-semantic-replay",
  "crates/research-register",
]
exclude = ["crates/terminal-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
serde_json_canonicalizer = "=0.3.2"
thiserror = "=2.0.21"
trybuild = "=1.0.121"
base64 = "=0.22.1"
yaml-rust = { package = "yaml-rust2", version = "=0.13.0", default-features = false }
ryu-js = "=1.0.3"
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal"] }
schemars = "=1.2.2"
jsonschema = { version = "=0.58.6", default-features = false }
gix = { version = "=0.90.0", default-features = false, features = ["sha1"] }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
panic = "unwind"
