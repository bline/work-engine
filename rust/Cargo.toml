[workspace]
resolver = "3"
members = [
  "crates/work-engine-types",
  "crates/lifecycle-core",
  "crates/lifecycle-store",
  "crates/lifecycle-runtime",
  "crates/lifecycle-provider",
  "crates/lifecycle-wire",
  "crates/lifecycle-client",
]
exclude = ["crates/terminal-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
serde_json_canonicalizer = "=0.3.2"
thiserror = "=2.0.21"
trybuild = "=1.0.121"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
panic = "unwind"
