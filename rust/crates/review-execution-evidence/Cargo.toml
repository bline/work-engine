[package]
name = "review-execution-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
test-support = []
test-faults = []

[dependencies]
claim-evidence = { path = "../claim-evidence" }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "claude_cbm_restricted"
path = "src/claude/cbm_launcher.rs"

[[bin]]
name = "claude_cbm_client"
path = "src/claude/cbm_client.rs"
