[package]
name = "review-execution-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
test-support = ["review-execution-custody/test-support", "slice-campaign/test-support"]
test-faults = []

[dependencies]
claim-evidence = { path = "../claim-evidence" }
review-execution-custody = { path = "../review-execution-custody" }
slice-campaign = { path = "../slice-campaign" }
review-episode-core = { path = "../review-episode-core" }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "claude_cbm_restricted"
path = "src/claude/cbm_launcher.rs"

[[bin]]
name = "claude_cbm_client"
path = "src/claude/cbm_client.rs"

[[bin]]
name = "claude_offline_peer"
path = "src/claude/offline_peer.rs"
required-features = ["test-support"]

[[bin]]
name = "claude_launch_guard"
path = "src/claude/launch_guard.rs"

[[bin]]
name = "claude_local_probe_peer"
path = "src/claude/local_probe_peer.rs"
required-features = ["test-support"]
