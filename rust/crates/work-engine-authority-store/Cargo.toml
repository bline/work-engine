[package]
name = "work-engine-authority-store"
description = "Private SQLite authority store for the first publication vertical (fixture-scoped authority)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "work_engine_authority_store"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
libc = "=0.2.190"
work-engine-organization = { path = "../work-engine-organization" }
work-engine-manual-host = { path = "../work-engine-manual-host" }

[dev-dependencies]
tempfile = "=3.27.0"
