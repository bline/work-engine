[package]
name = "lifecycle-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
controlled-proof = []
native-sim-proof = []

[dependencies]
lifecycle-core = { path = "../lifecycle-core" }
lifecycle-semantic = { path = "../lifecycle-semantic" }
lifecycle-store = { path = "../lifecycle-store" }
lifecycle-runtime = { path = "../lifecycle-runtime" }
lifecycle-provider = { path = "../lifecycle-provider" }
lifecycle-codex = { path = "../lifecycle-codex" }
lifecycle-wire = { path = "../lifecycle-wire" }
work-engine-types = { path = "../work-engine-types" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
getrandom = "=0.3.4"

[dev-dependencies]
tempfile = "=3.27.0"
lifecycle-client = { path = "../lifecycle-client" }
lifecycle-test-support = { path = "../lifecycle-test-support" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[[test]]
name = "s4_vertical"
path = "../../tests/s4_vertical.rs"
required-features = ["controlled-proof"]

[[test]]
name = "s4_crash"
path = "../../tests/s4_crash.rs"
required-features = ["controlled-proof"]

[[test]]
name = "s4_security"
path = "../../tests/s4_security.rs"
required-features = ["controlled-proof"]

[[test]]
name = "s4_contract"
path = "../../tests/s4_contract.rs"
required-features = ["controlled-proof"]

[[test]]
name = "s6_semantic_preservation"
path = "../../tests/s6_semantic_preservation.rs"
required-features = ["native-sim-proof"]

[[test]]
name = "s6_s7_s5_native_compat"
path = "../../tests/s6_s7_s5_native_compat.rs"
required-features = ["native-sim-proof"]
