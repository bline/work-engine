[package]
name = "review-episode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-faults = ["review-episode-store/test-faults"]

[dependencies]
review-episode-core = { path = "../review-episode-core" }
review-episode-store = { path = "../review-episode-store" }
thiserror.workspace = true
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"
sha2.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true

[[bin]]
name = "work-engine-review-episode"
path = "src/main.rs"
