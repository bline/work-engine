[package]
name = "decision-readiness"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Decision-specific readiness: closed profile, subject and observation schemas, plan derivation, and mechanical evaluation. Tooling never emits a verdict."

[lib]
name = "decision_readiness"
path = "src/lib.rs"

[[bin]]
name = "work-engine-readiness"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[workspace]
