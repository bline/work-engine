[package]
name = "context-pressure"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Deterministic context-pressure evidence: token-usage projector and hysteresis controller, hash-parity ports of the JS modules. Evidence only; no lifecycle authority."

[lib]
name = "context_pressure"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[workspace]
