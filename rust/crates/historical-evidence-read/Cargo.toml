[package]
name = "historical-evidence-read"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
historical-evidence-wire = { path = "../historical-evidence-wire" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
libc = "=0.2.175"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
chrono = "=0.4.42"

[workspace]
