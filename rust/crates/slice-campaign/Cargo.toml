[package]
name = "slice-campaign"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-faults = []
test-support = []
# Inert cross-crate composition tests only. No live selection or effect adapter.
offline-qualification-fixture = []
# Only the protected, same-opening natural-exit foreground composition.
private-natural-exit-foreground = ["offline-qualification-fixture"]

[dependencies]
claim-evidence = { path = "../claim-evidence" }
review-execution-custody = { path = "../review-execution-custody" }
review-episode = { path = "../review-episode" }
review-episode-core = { path = "../review-episode-core" }
review-episode-store = { path = "../review-episode-store" }
slice-campaign-identity = { path = "../slice-campaign-identity" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ryu-js.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs", "net", "process"] }
workspace-publication = { path = "../workspace-publication" }

[dev-dependencies]
tempfile = "=3.27.0"
tokio.workspace = true
