[package]
name = "work-engine-organization-authority"
description = "Pure organizational admission core: owner-attested records, reservation-sealed authority observation, Gate O subset (O3, O4, O5, O8, O9), Gate R (R1-R4) and effect-admission states. No I/O, no clock, no storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "work_engine_organization_authority"
path = "src/lib.rs"

[features]
default = []
# Fixture-only boundary: every record constructor and the in-memory observation source exist only
# with this non-default feature. Without it no record, observation or admission can be built.
fixture = []

[dependencies]
sha2.workspace = true
thiserror.workspace = true
work-engine-organization = { path = "../work-engine-organization" }

[dev-dependencies]
serde_json.workspace = true
