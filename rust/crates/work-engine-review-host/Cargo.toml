[package]
name = "work-engine-review-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
test-peer = []
test-faults = ["review-workflow/test-faults"]

[dependencies]
review-workflow = { path = "../review-workflow" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
slice-campaign = { path = "../slice-campaign" }
claim-evidence = { path = "../claim-evidence" }
review-episode-core = { path = "../review-episode-core" }
sha2.workspace = true
tempfile = "=3.27.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[[bin]]
name = "work-engine-review-host"
path = "src/main.rs"

[[bin]]
name = "review-host-controlled-peer"
path = "tests/support/peer.rs"
required-features = ["test-peer"]
