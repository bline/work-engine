[package]
name = "work-engine-review-delivery"
description = "Experimental offline review-contract delivery vertical. Default build: pure freezing of a full ReviewPreparation and exact-correspondence checks of an SDK observation. Non-default `fixture` feature: provider-disabled Pi SDK child plus the existing fixture consumer, gated by fixture-domain organizational admission (S-A) and labelled assumed discharges. Mints no authority; no production admission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "work_engine_review_delivery"
path = "src/lib.rs"

[features]
default = []
# Fixture-only boundary: starts the provider-disabled Pi SDK child and reaches the existing
# fixture consumer. Everything it supplies is a synthetic test assumption.
fixture = [
  "work-engine-review-preparation/fixture",
  "work-engine-organization-authority/fixture",
  "dep:libc",
]
# Test-only and not implied by `fixture`: exposes `native::test_support`, the generic owned-attempt
# runner over a caller-built command, outside the delivery gate. A feature states build intent; it
# is not access control. Without it, a `fixture` build has the gated delivery path as its only
# spawn route.
test-support = ["fixture"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Fixture-only: poll(2)/fcntl for the single-owner native attempt (already in the workspace lock).
libc = { version = "=0.2.190", optional = true }
work-engine-review-preparation = { path = "../work-engine-review-preparation" }
review-episode-core = { path = "../review-episode-core" }
work-engine-organization = { path = "../work-engine-organization" }
# Organizational admission core (S-A). Its record constructors, fixture source and fixture policy
# exist only under this crate's `fixture` feature.
work-engine-organization-authority = { path = "../work-engine-organization-authority" }

[[test]]
name = "native_vertical"
path = "tests/native_vertical.rs"
# The lifecycle tests in this file drive the generic runner through `native::test_support`.
required-features = ["fixture", "test-support"]

[[test]]
name = "gate"
path = "tests/gate.rs"
required-features = ["fixture"]

[[test]]
name = "binding"
path = "tests/binding.rs"
required-features = ["fixture"]
