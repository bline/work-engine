[package]
name = "work-engine-completion-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
fixture = ["dep:review-execution-custody", "review-execution-custody/test-support"]
test-faults = ["slice-campaign/test-faults"]

[dependencies]
slice-campaign = { path = "../slice-campaign" }
workspace-publication = { path = "../workspace-publication" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustix = { version = "=1.1.5", features = ["net", "process"] }
claim-evidence = { path = "../claim-evidence" }
review-episode = { path = "../review-episode" }
review-episode-core = { path = "../review-episode-core" }
review-episode-store = { path = "../review-episode-store" }
review-execution-custody = { path = "../review-execution-custody", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
