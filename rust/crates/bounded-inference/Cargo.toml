[package]
name = "bounded-inference"
version = "0.1.0"
edition = "2021"

[features]
auth-test-faults = []
journal-test-faults = []

[dependencies]
lifecycle-semantic = { path = "../lifecycle-semantic" }
base64 = { workspace = true }
getrandom = "=0.3.4"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "=1.53.2", features = ["rt", "time", "macros", "net", "io-util"] }
url = "=2.5.0"

[dev-dependencies]
rcgen = "=0.14.10"
rustls = "=0.23.46"
