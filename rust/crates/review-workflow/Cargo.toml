[package]
name = "review-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
test-support = ["slice-campaign/test-support", "review-execution-evidence/test-support"]
test-faults = ["slice-campaign/test-faults", "claim-evidence/test-faults", "review-episode/test-faults", "review-execution-evidence/test-faults"]

[dependencies]
work-engine-compiler = { path = "../work-engine-compiler" }
slice-campaign = { path = "../slice-campaign" }
claim-evidence = { path = "../claim-evidence" }
review-episode = { path = "../review-episode" }
review-episode-core = { path = "../review-episode-core" }
review-episode-store = { path = "../review-episode-store" }
review-execution-evidence = { path = "../review-execution-evidence" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
review-execution-evidence = { path = "../review-execution-evidence", features = ["test-support"] }
