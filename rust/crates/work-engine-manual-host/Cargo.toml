[package]
name = "work-engine-manual-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
offline-qualification-fixture = ["dep:slice-campaign", "slice-campaign/offline-qualification-fixture"]
private-init-only-acquisition = ["offline-qualification-fixture", "dep:httparse", "dep:rustix"]
private-natural-exit-foreground = ["private-init-only-acquisition", "slice-campaign/private-natural-exit-foreground"]

[dependencies]
slice-campaign = { path = "../slice-campaign", optional = true }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
schemars.workspace = true
libc = "=0.2.190"
httparse = { version = "=1.10.1", optional = true }
rustix = { version = "=1.1.5", features = ["net", "process"], optional = true }
zstd = "=0.13.3"
rustls = "=0.23.46"
rustls-platform-verifier = "=0.7.1"
review-episode-core = { path = "../review-episode-core" }
review-execution-evidence = { path = "../review-execution-evidence" }
repository-claims-handoff = { path = "../repository-claims-handoff" }
lifecycle-wire = { path = "../lifecycle-wire" }
native-realization = { path = "../native-realization" }
hosted-route-availability = { path = "../hosted-route-availability" }

[dev-dependencies]
# Read-only assertions against the private fake attempt's Campaign history.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tempfile = "=3.27.0"

[dependencies.session-task-admission]
path = "../session-task-admission"

[[bin]]
name = "work-engine-b-init-qualify-v4"
required-features = ["private-natural-exit-foreground"]

[[example]]
name = "work-engine-b-init-only"
required-features = ["offline-qualification-fixture"]
