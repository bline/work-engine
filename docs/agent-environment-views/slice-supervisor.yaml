invariants:
  INV-001:
    owner: user
    applies: entire run
    class: authority
    condition: The original user objective remains authoritative; work sources and builders may organize
      evidence but may not silently narrow, broaden, reinterpret, or omit it.
    causal_parent: The campaign exists to serve the delegated objective. A locally coherent result for
      a changed objective is not valid completion.
    enforcement: model + receipt review
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-RECEIPT
    relations:
    - INV-003
    - INV-030
    - INV-007
    - INV-027
    sources: '[Design §1.1](../DESIGN.md#11-contracts-and-invariants), [Supervisor: resolve contract](../skills/slice-supervisor/SKILL.md#resolve-the-campaign-contract)'
  INV-002:
    owner: user / owning contract
    applies: entire run
    class: authority
    condition: The system acts only within granted authority and preserves every real human approval boundary.
      New product, ownership, value, destructive, publication, migration, or configuration authority must
      come from its owner.
    causal_parent: Model decision authority is subordinate to user authority. Acting without authority
      makes the transition invalid even if technically successful.
    enforcement: model + explicit user decision
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-COMPLETION
    relations:
    - INV-009
    - INV-024
    - INV-027
    sources: '[Design §11](../DESIGN.md#11-user-authority-and-approval), [Supervisor: accept or escalate](../skills/slice-supervisor/SKILL.md#accept-or-escalate-the-plan)'
  INV-003:
    owner: supervisor
    applies: run initialization and every terminal receipt
    class: provenance
    condition: The effective campaign configuration preserves explicit versus defaulted ownership, campaign-source
      identity, and authorized amendments; the initial resolved contract is immutable within a run except
      for a recorded human-approved amendment.
    causal_parent: Configuration determines authority and acceptance. Silent reinterpretation makes later
      behavior and receipts unauditable.
    enforcement: deterministic preflight + assembly validation
    mechanisms:
    - MECH-PREFLIGHT
    - MECH-ASSEMBLER
    relations:
    - INV-001
    - INV-002
    - INV-020
    - INV-028
    sources: '[Configuration: provenance](../skills/slice-supervisor/references/work-engine-config.md#provenance-and-amendments),
      [`preflightCampaign`](../skills/slice-supervisor/scripts/campaign-preflight.mjs)'
  INV-004:
    owner: supervisor
    applies: initialization
    class: interface
    condition: Unknown fields, meaningful source conflicts, unsupported builder capabilities, and unknown
      validation requirements fail closed; the supervisor may not emulate or silently weaken a missing
      capability.
    causal_parent: Misspellings or unsupported adapters can silently change the campaign contract. Continuing
      would claim guarantees the machinery cannot provide.
    enforcement: deterministic preflight + adapter declaration
    mechanisms:
    - MECH-PREFLIGHT
    - MECH-SUPERVISOR
    - MECH-BUILDER
    relations:
    - INV-003
    - INV-014
    sources: '[Configuration: builder adapter](../skills/slice-supervisor/references/work-engine-config.md#builder-adapter-contract),
      [Builder: launch](../skills/slice-builder/SKILL.md#launch-the-builder)'
  INV-005:
    owner: supervisor
    applies: entire run
    class: ownership
    condition: The supervisor owns configuration, lifecycle, acceptance, limits, durable records, continuation,
      and human escalation; it does not perform or re-derive repository inspection, implementation, or
      domain validation.
    causal_parent: Supervisor context is the campaign control plane. Mixing builder work into it collapses
      ownership and defeats bounded context and receipt boundaries.
    enforcement: role instruction
    mechanisms:
    - MECH-SUPERVISOR
    relations:
    - INV-006
    - INV-019
    sources: '[Supervisor](../skills/slice-supervisor/SKILL.md), [Builder](../skills/slice-builder/SKILL.md)'
  INV-006:
    owner: builder
    applies: one slice
    class: ownership
    condition: One configured builder owns repository understanding, architectural judgment, implementation,
      checks, review remediation, and both builder receipts for one coherent slice.
    causal_parent: Split responsibility can lose the semantic path and make ownership or evidence attribution
      ambiguous.
    enforcement: role instruction + builder identity tracking
    mechanisms:
    - MECH-BUILDER
    relations:
    - INV-005
    - INV-011
    - INV-016
    - INV-019
    sources: '[Builder](../skills/slice-builder/SKILL.md)'
  INV-007:
    owner: builder
    applies: planning
    class: mutation
    condition: Planning is read-only and produces an evidence-based bounded plan; implementation may not
      begin during planning.
    causal_parent: Plan acceptance is the authority boundary for mutation. Early mutation bypasses scope
      and approval review.
    enforcement: builder contract + supervisor phase control
    mechanisms:
    - MECH-BUILDER
    - MECH-SUPERVISOR
    relations:
    - INV-009
    - INV-002
    - INV-008
    sources: '[Configuration: builder adapter](../skills/slice-supervisor/references/work-engine-config.md#builder-adapter-contract),
      [Builder: planning](../skills/slice-builder/SKILL.md#planning-turn)'
  INV-008:
    owner: builder / supervisor
    applies: planning and implementation
    class: ownership
    condition: The slice has an explicit changed-output boundary, preserves baseline and unrelated user
      work, classifies overlaps, and stops mutation when new scope or unattributable changes appear.
    causal_parent: Truthful ownership is required to avoid overwriting user work or smuggling unaccepted
      scope into a result.
    enforcement: plan/receipt fields + workspace checks
    mechanisms:
    - MECH-BUILDER
    - MECH-GATE
    - MECH-CHECKPOINT
    relations:
    - INV-011
    - INV-021
    - INV-024
    sources: '[Builder: enforce boundary](../skills/slice-builder/SKILL.md#enforce-the-boundary), [Checkpoint](../skills/slice-checkpoint/SKILL.md)'
  INV-009:
    owner: supervisor / user
    applies: plan acceptance
    class: authority
    condition: Every implementation has an explicit accepted plan recorded as procedural auto-approval
      or human approval under configured policy. Uninterrupted execution may combine turns but may not
      erase acceptance or phase accounting.
    causal_parent: Acceptance establishes authorized scope and consequences. Mutation without it lacks
      authority and cannot yield an accepted receipt.
    enforcement: state machine + receipt validation
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-RECEIPT
    relations:
    - INV-007
    - INV-015
    sources: '[Supervisor: accept plan](../skills/slice-supervisor/SKILL.md#accept-or-escalate-the-plan),
      [Receipt schema](../skills/slice-supervisor/references/receipt-schema.md)'
  INV-010:
    owner: supervisor / builder
    applies: any active phase
    class: lifecycle
    condition: When evidence invalidates a premise, boundary, route, or acceptance evidence, applicable
      observations remain preserved, dependent decisions are marked stale, the route is revised, and materially
      changed plans return for renewed acceptance.
    causal_parent: Routes are hypotheses, but stale conclusions cannot remain authoritative. Silent scope
      expansion and ceremonial continuation both violate truthful state.
    enforcement: route-revision receipt + state transition
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-BUILDER
    - MECH-RECEIPT
    relations:
    - INV-001
    - INV-009
    - INV-020
    sources: '[Design §10](../DESIGN.md#10-route-revision), [Decision policy](../skills/slice-builder/references/decision-policy.md#adapt-without-losing-truth)'
  INV-011:
    owner: builder / supervisor
    applies: planning through gate
    class: interface
    condition: A confirmed semantic-path certificate identifies the actual trigger, producer, state owner,
      consumer, lifecycle, observable consequence, downstream proof, and insufficient substitute; missing
      or conflicting ownership reopens planning.
    causal_parent: A locally plausible edit is insufficient if it is disconnected from the real producer-to-consumer
      consequence.
    enforcement: plan and receipt validation + model judgment
    mechanisms:
    - MECH-BUILDER
    - MECH-RECEIPT
    relations:
    - INV-015
    - INV-019
    - INV-028
    sources: '[Builder: planning](../skills/slice-builder/SKILL.md#planning-turn), [Builder receipt](../skills/slice-builder/references/builder-receipt.md#required-outcome-fields)'
  INV-012:
    owner: configured independent reviewer / builder
    applies: falsification and adversarial review
    class: evidence independence
    condition: Evidence claimed as independent begins in a fresh context independent of the builder and
      the reviewer is read-only. Retrieval alone never satisfies a required independent-review claim.
    causal_parent: If the reviewer shares builder reasoning or mutates the work, correlated-error reduction
      and the independence claim become false.
    enforcement: isolated reviewer role + receipt provenance
    mechanisms:
    - MECH-BUILDER
    - MECH-REVIEW-PROVIDER
    relations:
    - INV-014
    - INV-020
    sources: '[Design §8](../DESIGN.md#8-independence-is-a-property-not-ritualized-amnesia), [Builder:
      launch](../skills/slice-builder/SKILL.md#launch-the-builder)'
  INV-013:
    owner: builder
    applies: implementation
    class: lifecycle
    condition: Implementation uses the accepted boundary and semantic-path certificate; inability of the
      selected owner or consumer to support the consequence causes a boundary-change request, not a substitute
      result.
    causal_parent: Acceptance authorized a specific semantic consequence, not arbitrary edits that happen
      to pass local checks.
    enforcement: builder phase contract
    mechanisms:
    - MECH-BUILDER
    relations:
    - INV-009
    - INV-011
    - INV-015
    sources: '[Builder: implementation](../skills/slice-builder/SKILL.md#implementation-turn)'
  INV-014:
    owner: builder / configured gate
    applies: gate
    class: acceptance
    condition: Every configured validation requirement is mapped to observable evidence and must pass
      for acceptance. It may not be silently waived or reported as passed when omitted; `not_applicable`
      requires a reason and cannot produce an accepted slice for a configured requirement.
    causal_parent: Configuration defines the acceptance contract. Missing evidence leaves the result unestablished.
    enforcement: deterministic gate + terminal receipt validator
    mechanisms:
    - MECH-GATE
    - MECH-RECEIPT
    relations:
    - INV-004
    - INV-015
    sources: '[Configuration: validation](../skills/slice-supervisor/references/work-engine-config.md#field-contract),
      [Receipt schema](../skills/slice-supervisor/references/receipt-schema.md#required-common-fields)'
  INV-015:
    owner: supervisor
    applies: acceptance
    class: acceptance
    condition: A slice is accepted only after its vertical semantic proof is observed, every blocking
      configured gate passes, blocking findings are resolved, and unresolved issues are truthfully classified.
      Completed edits or pending validation are not acceptance.
    causal_parent: Acceptance asserts that the protected downstream consequence was demonstrated, not
      merely that work occurred.
    enforcement: builder audit receipt + supervisor acceptance + schema validation
    mechanisms:
    - MECH-BUILDER
    - MECH-GATE
    - MECH-RECEIPT
    relations:
    - INV-009
    - INV-011
    - INV-014
    - INV-017
    sources: '[Supervisor: accept slice](../skills/slice-supervisor/SKILL.md#accept-and-record-a-slice),
      [Receipt schema](../skills/slice-supervisor/references/receipt-schema.md#required-common-fields)'
  INV-016:
    owner: builder
    applies: planning through gate
    class: context
    condition: The builder identity remains stable through the normal planning, implementation, and gate
      lifecycle for a slice; any replacement is non-concurrent, inherits the accepted boundary and attributed
      state, and records its reason.
    causal_parent: Persistent bounded understanding supports coherent implementation, while concurrent
      mutable-space owners make attribution and repair state ambiguous.
    enforcement: supervisor identity management + receipt metrics
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-BUILDER
    relations:
    - INV-006
    - INV-008
    - INV-019
    sources: '[Supervisor: start builder](../skills/slice-supervisor/SKILL.md#start-one-configured-builder),
      [Builder: reasoning escalation](../skills/slice-builder/SKILL.md#escalate-reasoning-only-from-evidence)'
  INV-017:
    owner: supervisor
    applies: between slices
    class: lifecycle
    condition: A new slice begins only after the preceding slice is accepted. Slice identities are positive,
      sequential, and contiguous for resumable history.
    causal_parent: Inter-slice context and checkpoint baseline derive from the preceding accepted terminal.
      Gaps or continuation after failure make lineage ambiguous.
    enforcement: supervisor state machine + resume validation
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-RESUME
    - MECH-RECEIPT
    relations:
    - INV-015
    - INV-019
    - INV-028
    sources: '[Supervisor: states](../skills/slice-supervisor/SKILL.md#resolve-the-campaign-contract),
      [`resume`](../skills/slice-supervisor/scripts/resume_campaign.py)'
  INV-018:
    owner: builder / supervisor
    applies: all evidence and metrics
    class: truth
    condition: Observations, inference, configured values, actual execution, and unavailable measurements
      remain distinguishable. Unknown is `null`, observed zero is zero, and estimates may not masquerade
      as facts.
    causal_parent: Audit and continuation decisions depend on truthful state. Conflating absence with
      zero or configuration with execution creates false evidence.
    enforcement: receipt schema + assembler + model contract
    mechanisms:
    - MECH-ASSEMBLER
    - MECH-RECEIPT
    - MECH-TELEMETRY
    relations:
    - INV-019
    - INV-020
    - INV-029
    sources: '[Design §12](../DESIGN.md#12-provenance-and-receipts), [Receipt: truth rules](../skills/slice-supervisor/references/receipt-schema.md#truth-and-safety-rules)'
  INV-019:
    owner: receipt boundary
    applies: accepted, stopped, or failed terminal
    class: interface
    condition: Every terminal slice has exactly one schema-valid durable audit receipt keyed by `(run_id,
      slice_number)` when durable metrics are enabled; duplicate identity, malformed history, prohibited
      content, or partial writes fail closed.
    causal_parent: The terminal record is the campaign's authoritative audit history. Duplicate or malformed
      identities destroy unambiguous lineage.
    enforcement: exclusive lock, validation, fsync, unique identity check
    mechanisms:
    - MECH-ASSEMBLER
    - MECH-FINALIZER
    - MECH-APPEND
    relations:
    - INV-015
    - INV-029
    - INV-017
    - INV-028
    sources: '[Receipt schema](../skills/slice-supervisor/references/receipt-schema.md), [`append`](../skills/slice-supervisor/scripts/append_metrics.py)'
  INV-020:
    owner: builder / receipt boundary
    applies: evidence selection and route revision
    class: provenance
    condition: Actual evidence capability, provider/role identity, attempt outcomes, provider failures,
      and real fallback transitions are recorded consistently. Capability availability is not use; a capability
      change is not automatically a fallback; evidence-mode fallback does not silently rewrite provider
      identity; retrieval is not independent review.
    causal_parent: Flexible routing remains auditable only if the record describes what actually happened
      and preserves role distinctions.
    enforcement: schema-v4 provenance validation
    mechanisms:
    - MECH-BUILDER
    - MECH-RECEIPT
    relations:
    - INV-012
    - INV-018
    - INV-003
    sources: '[Design §6](../DESIGN.md#6-evidence-and-capability-selection), [Receipt: evidence provenance](../skills/slice-supervisor/references/receipt-schema.md#required-version-4-evidence-provenance)'
  INV-021:
    owner: telemetry ingress / assembler
    applies: terminal assembly
    class: provenance
    condition: Builder runtime telemetry is accepted only after independent identity corroboration and
      exact run/slice binding; ambiguous, mismatched, malformed, nonterminal, or self-reported identity
      is unavailable rather than authoritative.
    causal_parent: Host measurements can overwrite semantic receipt metrics. Weak binding would allow
      another rollout's measurements to become campaign history.
    enforcement: telemetry schema + deterministic harvester + assembler checks
    mechanisms:
    - MECH-TELEMETRY
    - MECH-ASSEMBLER
    relations:
    - INV-018
    - INV-019
    sources: '[Receipt: telemetry ingress](../skills/slice-supervisor/references/receipt-schema.md#telemetry-ingress-boundary),
      [`assemble`](../skills/slice-supervisor/scripts/assemble_receipt.py)'
  INV-022:
    owner: supervisor / receipt boundary
    applies: inter-slice handoff
    class: ownership
    condition: The compact builder handoff is non-durable context and is never appended as the audit record.
      Only its validated semantic collections may be projected into separately owned continuation context.
    causal_parent: Audit evidence and next-builder context have different owners, lifetimes, and consumers.
      Flattening them either pollutes durable history or loses resumable semantic state.
    enforcement: finalizer handoff validation and projection
    mechanisms:
    - MECH-FINALIZER
    - MECH-RESUME
    relations:
    - INV-017
    - INV-028
    - INV-030
    sources: '[Handoff receipt](../skills/slice-builder/references/handoff-receipt.md), [Supervisor: accept
      slice](../skills/slice-supervisor/SKILL.md#accept-and-record-a-slice)'
  INV-023:
    owner: receipt owners
    applies: receipts and handoffs
    class: security / context
    condition: Receipts and handoffs contain compact operational consequences, not raw prompts, transcripts,
      chain-of-thought, source excerpts, diffs, patches, raw logs, debug output, or secrets.
    causal_parent: These artifacts are durable or reused across contexts; raw execution material creates
      privacy, security, context, and accidental-authority risks.
    enforcement: prohibited-content validator + role contracts
    mechanisms:
    - MECH-RECEIPT
    - MECH-BUILDER
    relations:
    - INV-019
    - INV-022
    sources: '[Receipt: truth rules](../skills/slice-supervisor/references/receipt-schema.md#truth-and-safety-rules),
      [Builder receipt](../skills/slice-builder/references/builder-receipt.md)'
  INV-024:
    owner: checkpoint adapter
    applies: candidate and lifecycle checkpoints
    class: mutation
    condition: Checkpoint mechanics mutate only private local Work Engine refs and immutable Git objects;
      they never move the user's branch, use the real index, alter the ordinary worktree, create tags,
      or publish refs.
    causal_parent: Checkpoints preserve acceptance evidence without taking authority over user-visible
      repository history or workspace state.
    enforcement: temporary index + private-ref restrictions
    mechanisms:
    - MECH-CHECKPOINT
    relations:
    - INV-002
    - INV-008
    - INV-026
    sources: '[Checkpoint](../skills/slice-checkpoint/SKILL.md), [`create_candidate`](../skills/slice-checkpoint/scripts/checkpoint.py)'
  INV-025:
    owner: supervisor / checkpoint lifecycle
    applies: candidate review and acceptance
    class: interface
    condition: Review and gate evidence used for checkpoint acceptance exactly bind the candidate commit,
      tree, task patch, plan version, scope revision, and gate receipt. Material repair produces a new
      candidate; stopped candidates never advance acceptance.
    causal_parent: Review of one artifact cannot authorize a different artifact. Any identity drift invalidates
      the acceptance claim.
    enforcement: exact binding validation + compare-and-swap
    mechanisms:
    - MECH-CHECKPOINT-LIFECYCLE
    relations:
    - INV-014
    - INV-026
    sources: '[Checkpoint schema](../skills/slice-checkpoint/references/checkpoint-schema.md), [`validate_binding`](../skills/slice-supervisor/scripts/checkpoint_lifecycle.py)'
  INV-026:
    owner: supervisor / resume boundary
    applies: accepted slice and continuation
    class: lifecycle
    condition: The immutable accepted private checkpoint—not current branch `HEAD`—is the authoritative
      baseline for the next slice when checkpointing is present, and recovery re-verifies its ref, commit,
      and tree.
    causal_parent: User-visible history can move independently of private acceptance. Using `HEAD` would
      silently change the accepted baseline.
    enforcement: checkpoint projection + resume verification
    mechanisms:
    - MECH-CHECKPOINT
    - MECH-FINALIZER
    - MECH-RESUME
    relations:
    - INV-025
    - INV-017
    - INV-028
    sources: '[Supervisor: checkpoints](../skills/slice-supervisor/SKILL.md#accept-and-record-a-slice),
      [`resume`](../skills/slice-supervisor/scripts/resume_campaign.py)'
  INV-027:
    owner: user / completion adapter
    applies: optional completion publication
    class: authority
    condition: A user-visible commit requires an explicit per-slice create decision over an exact proposal
      bound to the accepted checkpoint and task-owned paths. Proposal provenance describes support but
      never grants mutation authority.
    causal_parent: Private acceptance is not authorization to publish repository history. Publishing extra
      or inferred content crosses the user's authority boundary.
    enforcement: user decision + proposal/request validation
    mechanisms:
    - MECH-COMPLETION-OFFER
    - MECH-COMPLETION
    relations:
    - INV-002
    - INV-008
    - INV-026
    sources: '[Completion adapter](../skills/slice-completion-commit/SKILL.md), [Completion receipt](../skills/slice-completion-commit/references/receipt-schema.md)'
  INV-028:
    owner: completion adapter / terminal finalizer
    applies: created completion receipt
    class: provenance
    condition: A `created` completion claim is persisted only after read-only verification re-establishes
      repository, proposal binding, commit, parent, tree, message, publication target, and resulting branch
      state. Publication uses an expected-parent atomic branch update and never pushes or tags.
    causal_parent: A shape-valid receipt is not evidence that Git mutation occurred, and an uncertain
      publication must not be repeated.
    enforcement: adapter verification + atomic ref update + finalizer validation
    mechanisms:
    - MECH-COMPLETION
    - MECH-FINALIZER
    relations:
    - INV-027
    - INV-019
    sources: '[Completion adapter](../skills/slice-completion-commit/SKILL.md), [`validate_receipt`](../skills/slice-completion-commit/scripts/completion_commit.py)'
  INV-029:
    owner: supervisor / completion-offer owner
    applies: delayed completion offer
    class: lifecycle
    condition: A live offer resolves at most once from open to a terminal state with compare-and-swap.
      Uncertain publication is reconciled read-only and never retried. Offer state never blocks checkpoint
      continuation or replaces checkpoint authority.
    causal_parent: Retrying uncertain publication can duplicate or misreport a commit; optional publication
      must not corrupt campaign continuation.
    enforcement: durable live offer + CAS + reconciliation
    mechanisms:
    - MECH-COMPLETION-OFFER
    - MECH-COMPLETION
    - MECH-RESUME
    relations:
    - INV-026
    - INV-028
    sources: '[Completion-offer schema](../skills/slice-supervisor/references/completion-offer-schema.md)'
  INV-030:
    owner: supervisor
    applies: terminal decision
    class: truth
    condition: Stops and failures preserve the exact triggering condition and are never represented as
      success. A builder's inability to find more work is evidence, not proof of objective completion;
      completion requires the configured condition and evidence that no supported in-scope slice remains.
    causal_parent: Terminal status controls continuation and user understanding. False success discards
      unresolved state and violates objective fidelity.
    enforcement: terminal state model + receipt validation
    mechanisms:
    - MECH-SUPERVISOR
    - MECH-RECEIPT
    relations:
    - INV-001
    - INV-018
    - INV-017
    - INV-031
    sources: '[Supervisor: continue](../skills/slice-supervisor/SKILL.md#decide-whether-to-continue),
      [Receipt schema](../skills/slice-supervisor/references/receipt-schema.md)'
  INV-031:
    owner: resume boundary
    applies: between terminal slices
    class: interface
    condition: Resume is read-only and succeeds only for one exact run with unique contiguous history,
      matching effective configuration and campaign-source identity, an accepted resumable terminal, valid
      continuation context, and any verified checkpoint binding. It does not recover mid-slice state or
      authorize amendments.
    causal_parent: Recovery must reconstruct authority from durable accepted evidence, not guessed partial
      state or current workspace position.
    enforcement: deterministic resume validation
    mechanisms:
    - MECH-RESUME
    relations:
    - INV-003
    - INV-017
    - INV-019
    - INV-026
    sources: '[Receipt: recovery](../skills/slice-supervisor/references/receipt-schema.md#telemetry-ingress-boundary),
      [`resume`](../skills/slice-supervisor/scripts/resume_campaign.py)'
  INV-032:
    owner: strategic planner / supervisor / user
    applies: strategic reconciliation
    class: authority
    condition: 'Strategic planning is advisory: it may return a durable recommendation but may not accept
      slices, direct builders, append receipts, mutate the roadmap, amend the campaign, or convert a recommendation
      into user approval.'
    causal_parent: Long-horizon judgment and campaign execution have different owners. Advice without
      authorization cannot change the active contract.
    enforcement: planner role + supervisor amendment boundary
    mechanisms:
    - MECH-STRATEGIC-PLANNER
    - MECH-SUPERVISOR
    relations:
    - INV-001
    - INV-002
    - INV-003
    sources: '[Strategic planner](../skills/strategic-planner/SKILL.md#preserve-the-authority-boundary),
      [Planning handoff](../skills/strategic-planner/references/planning-handoff.md)'
  INV-034:
    owner: user / supervisor
    applies: entire run
    class: authority / lifecycle
    condition: Explicit hard limits and stop conditions remain binding, are never invented when absent,
      and cause a truthful stop when crossed; absence of a configured numeric limit is not permission
      to cross another safety or authority boundary.
    causal_parent: Limits bound delegated resources and continuation authority. Ignoring or fabricating
      them changes the contract.
    enforcement: preflight provenance + supervisor terminal decision
    mechanisms:
    - MECH-PREFLIGHT
    - MECH-SUPERVISOR
    - MECH-RECEIPT
    relations:
    - INV-002
    - INV-003
    - INV-030
    sources: '[Configuration: field contract](../skills/slice-supervisor/references/work-engine-config.md#field-contract),
      [Supervisor: continue](../skills/slice-supervisor/SKILL.md#decide-whether-to-continue)'
  INV-035:
    owner: repository instructions / user / supervisor
    applies: intervention and completion notification
    class: authority
    condition: A notification is sent only when the effective configuration and applicable repository
      instructions authorize it; repository-required intervention notification remains binding, ordinary
      progress does not create notification authority, and a prohibited completion notification is not
      sent.
    causal_parent: Notifications are external side effects governed by both request policy and repository
      policy. Sending or suppressing one outside those boundaries violates the owning authority.
    enforcement: supervisor policy evaluation
    mechanisms:
    - MECH-SUPERVISOR
    relations:
    - INV-002
    - INV-003
    sources: '[Configuration: notifications](../skills/slice-supervisor/references/work-engine-config.md#field-contract),
      [Supervisor: notify](../skills/slice-supervisor/SKILL.md#notify-and-finish)'
  INV-036:
    owner: workspace-coordination service
    applies: mediated shared-resource mutation
    class: authority / mutation
    condition: Every mediated shared mutation identifies its complete resource set and carries a current
      resource-matched admission backed by an unexpired lease and monotonically increasing fencing token;
      messages, acknowledgements, and advisory claims confer no mutation authority.
    causal_parent: Semantically disjoint agents can still collide on physical resources, and stale or
      cooperative-only claims cannot exclude a superseded actor. Admitting absent, expired, mismatched,
      or stale authority permits conflicting mutations.
    enforcement: durable lease generations + mutation-boundary admission
    mechanisms:
    - MECH-WORKSPACE-COORDINATION
    relations:
    - INV-002
    - INV-008
    - INV-028
    - INV-038
    - INV-039
    sources: '[S8P direction](../app-server/docs/skills-migration-plan.md#approved-post-s8-execution-direction),
      [S8P slice](../app-server/docs/skills-migration-plan.md#s8p--isolated-agent-worktrees-and-publication-authority)'
  INV-037:
    owner: workspace-coordination service / resource adapter
    applies: resource allocation and mutation
    class: mutation
    condition: Resources that cannot enforce fencing at mutation admission are operation-namespaced or
      explicitly classified as advisory-only; a prior token check separated from mutation never establishes
      exclusive authority.
    causal_parent: Validation followed by later mutation has a time-of-check/time-of-use window in which
      the lease can expire or be superseded. Treating such validation as a fence permits stale mutation.
    enforcement: namespaced allocation or mediated mutation adapter
    mechanisms:
    - MECH-WORKSPACE-COORDINATION
    - MECH-WORKTREE-LIFECYCLE
    relations:
    - INV-036
    - INV-008
    sources: '[S8P coordination boundary](../app-server/docs/skills-migration-plan.md#approved-post-s8-execution-direction),
      [Design §4](../DESIGN.md#4-state-and-persistence)'
  INV-038:
    owner: worktree-lifecycle adapter
    applies: builder workspace allocation and cleanup
    class: ownership / mutation
    condition: Each agent or slice mutates only an operation-namespaced local worktree created from an
      explicit repository baseline with an independent checkout, index, and `HEAD`; allocation, use, and
      cleanup perform no implicit fetch or push and preserve shared objects, accepted checkpoints, and
      user-authored work.
    causal_parent: A shared checkout or index lets one actor's stage, commit, cleanup, or branch movement
      corrupt another actor's state, while per-slice cloning needlessly couples local execution to network
      and repository-history duplication.
    enforcement: explicit-baseline local worktree adapter + retention-safe cleanup
    mechanisms:
    - MECH-WORKTREE-LIFECYCLE
    - MECH-WORKSPACE-COORDINATION
    relations:
    - INV-008
    - INV-036
    - INV-037
    - INV-024
    - INV-039
    sources: '[S8P slice](../app-server/docs/skills-migration-plan.md#s8p--isolated-agent-worktrees-and-publication-authority)'
  INV-039:
    owner: user / Git publisher / validation owner
    applies: canonical branch publication
    class: authority / acceptance / provenance
    condition: Canonical publication starts from an accepted checkpoint and the observed branch tip in
      a separate integration worktree, admits only the exact attributed manifest, validates the integrated
      tree, and atomically checks the current resource fencing token and expected parent at branch mutation
      before recording the resulting commit, tree, and generation.
    causal_parent: A validated private checkpoint can become stale relative to the publication target,
      and non-atomic fencing or validation of the pre-integration tree can publish unreviewed, conflicting,
      or superseded state.
    enforcement: isolated integration + integrated-tree gate + mutation-authority atomic admission
    mechanisms:
    - MECH-GIT-PUBLISHER
    - MECH-WORKSPACE-COORDINATION
    - MECH-WORKTREE-LIFECYCLE
    relations:
    - INV-002
    - INV-025
    - INV-027
    - INV-036
    - INV-038
    - INV-028
    sources: '[S8P direction](../app-server/docs/skills-migration-plan.md#approved-post-s8-execution-direction),
      [S8P slice](../app-server/docs/skills-migration-plan.md#s8p--isolated-agent-worktrees-and-publication-authority)'
mechanisms:
  MECH-APPEND:
    component: '`append_metrics.py`'
    affordance: Validates schema-v4 current writes and atomically appends a unique durable terminal.
    edges: enforces `INV-019`, `INV-020`, `INV-023`
  MECH-ASSEMBLER:
    component: '`assemble_receipt.py`'
    affordance: Replaces model-authored config and runtime metrics with preflight- and ingress-owned values.
    edges: enforces `INV-003`, `INV-018`–`INV-021`
  MECH-BUILDER:
    component: '`slice-builder` skill'
    affordance: Owns one engineering slice and its semantic evidence, mutation, checks, and receipts.
    edges: establishes `INV-006`–`INV-016`, `INV-020`, `INV-022`
  MECH-CHECKPOINT:
    component: '`slice-checkpoint` adapter'
    affordance: Constructs immutable candidates with a temporary index and private refs.
    edges: realizes `INV-024`, `INV-026`
  MECH-CHECKPOINT-LIFECYCLE:
    component: '`checkpoint_lifecycle.py`'
    affordance: Validates exact review/gate binding and creates accepted/stopped private lifecycle identities.
    edges: realizes `INV-025`
  MECH-COMPLETION:
    component: '`slice-completion-commit` adapter'
    affordance: Verifies and atomically publishes an explicitly approved commit.
    edges: realizes `INV-027`, `INV-028`
  MECH-COMPLETION-OFFER:
    component: '`completion_offer_lifecycle.py`'
    affordance: Stores and resolves one optional live offer with compare-and-swap.
    edges: realizes `INV-029`
  MECH-FINALIZER:
    component: '`finalize_receipt.py`'
    affordance: Composes assembly, continuation, checkpoint, completion verification, and append without
      a mutable intermediate.
    edges: enforces `INV-019`, `INV-022`, `INV-026`, `INV-028`
  MECH-GATE:
    component: '`run_gate.py`'
    affordance: Executes an explicit check manifest as argument arrays with compact fail-fast results.
    edges: enforces evidence for `INV-014`, `INV-015`
  MECH-GIT-PUBLISHER:
    component: App Server canonical Git publisher
    affordance: Reconciles an accepted checkpoint in an isolated integration worktree, validates the integrated
      tree, and atomically admits the branch mutation.
    edges: realizes `INV-039`; refines `INV-028`
  MECH-PREFLIGHT:
    component: '`campaign-preflight.mjs`'
    affordance: Resolves named campaigns, defaults, source digests, and transient capabilities; rejects
      invalid shapes.
    edges: enforces `INV-003`, `INV-004`
  MECH-RECEIPT:
    component: receipt schemas and validators
    affordance: Defines terminal, builder, handoff, checkpoint, completion, and planning artifact boundaries.
    edges: enforces `INV-003`, `INV-009`, `INV-011`, `INV-014`, `INV-018`–`INV-023`, `INV-030`
  MECH-RESUME:
    component: '`resume_campaign.py`'
    affordance: Reconstructs only validated inter-slice continuation state.
    edges: enforces `INV-017`, `INV-026`, `INV-031`
  MECH-REVIEW-PROVIDER:
    component: configured independent-review role
    affordance: Supplies isolated read-only falsification or adversarial evidence when required.
    edges: supports `INV-012`, `INV-014`
  MECH-STRATEGIC-PLANNER:
    component: '`strategic-planner` skill'
    affordance: Reconciles durable strategic evidence and returns an advisory handoff.
    edges: realizes `INV-032`, `INV-033`
  MECH-SUPERVISOR:
    component: '`slice-supervisor` skill'
    affordance: Owns campaign state, phase transitions, acceptance, limits, and continuation.
    edges: owns `INV-003`, `INV-005`, `INV-009`, `INV-017`, `INV-030`
  MECH-TELEMETRY:
    component: telemetry ingress schema and harvester
    affordance: Binds host runtime measurements to the launched builder identity.
    edges: enforces `INV-018`, `INV-021`
  MECH-WORKSPACE-COORDINATION:
    component: App Server workspace-coordination service
    affordance: Issues expiring resource leases and monotonic fencing generations and admits mediated
      mutations against current resource state.
    edges: realizes `INV-036`, `INV-037`; supports `INV-039`
  MECH-WORKTREE-LIFECYCLE:
    component: App Server Git worktree adapter
    affordance: Allocates and cleans operation-namespaced local worktrees from explicit baselines without
      implicit network operations.
    edges: realizes `INV-037`, `INV-038`
