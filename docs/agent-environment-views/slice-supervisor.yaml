  semantics:
    description: A role environment is the declared operational world exposed by Work Engine, not a claim
      that every platform or conversational influence has been modeled.
    layers:
      role_contract: stable authority, ownership, obligations, and prohibitions
      effective_environment: configured capabilities, gates, limits, and providers
      live_overlay: current runtime state; intentionally absent from this baseline
    relation_meanings:
      bound_by: the invariant directly constrains the role
      must_require: the role must obtain the invariant consequence from another owner
      may_invoke: the role can request the capability within its authority
      may_observe: the role can receive or inspect the state or artifact
      may_mutate: the role is authorized to change the state within the stated boundary
      owns: the role owns the artifact contract or lifecycle consequence
      emits: the role produces the artifact but does not necessarily own its lifecycle
      consumes: the artifact is an input to the role
      forbidden_from: an explicit negative authority boundary
      mediated_by: the target transition is available only through the named owner
  analysis_queries:
    obligation_coverage: For every bound_by and must_require invariant, find an owned, invoked, or mediated
      capability/artifact path that can establish or evidence it.
    observability_gap: Find decisions or obligations whose required state is absent from may_observe.
    authority_leak: Find may_mutate targets or capability transitions outside accepted authority.
    orphan_agency: Find invoked capabilities or mutation targets with no path to an objective, invariant
      consequence, required artifact, or downstream consumer.
    redundant_affordance: Compare capabilities that expose the same transition, evidence distinction,
      authority boundary, reversibility, and failure-isolation properties.
    procedural_drift: Find invariants that constrain a route or sequence without a route-invariant product
      failure mode.
    independence_violation: Find independent evidence paths that share builder reasoning context or mutation
      authority.
    ownership_gap: Find emitted artifacts with no lifecycle owner or downstream consumer.
