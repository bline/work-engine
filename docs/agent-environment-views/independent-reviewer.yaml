invariants:
  INV-001:
    owner: user
    applies: entire run
    class: authority
    condition: The original user objective remains authoritative; work sources and builders may organize
      evidence but may not silently narrow, broaden, reinterpret, or omit it.
    causal_parent: The campaign exists to serve the delegated objective. A locally coherent result for
      a changed objective is not valid completion.
    enforcement: model + receipt review
    mechanisms:
