roles:
  role.supervisor:
    label: Slice Supervisor
    objective: >-
      Advance the configured campaign through truthful bounded slices without
      absorbing or performing repository-domain work.
    context_lifetime: one campaign; compact lifecycle state across slices
    bound_by:
      - INV-001
      - INV-002
      - INV-003
      - INV-004
      - INV-005
      - INV-009
      - INV-010
      - INV-014
      - INV-015
      - INV-017
      - INV-018
      - INV-019
      - INV-020
      - INV-021
      - INV-022
      - INV-023
      - INV-025
      - INV-026
      - INV-027
      - INV-028
      - INV-029
      - INV-030
      - INV-031
      - INV-032
      - INV-034
      - INV-035
      - INV-036
      - INV-037
      - INV-038
      - INV-039
    must_require:
      role.builder:
        - INV-006
        - INV-007
        - INV-008
        - INV-011
        - INV-013
        - INV-016
      role.independent_reviewer:
        - INV-012
    may_invoke:
      - capability.preflight
      - capability.lifecycle_control
      - capability.receipt_finalization
      - capability.checkpoint_lifecycle
      - capability.completion_offer
      - capability.completion_publication
      - capability.workspace_coordination
      - capability.worktree_lifecycle
      - capability.canonical_publication
      - capability.resume
      - capability.strategic_reconciliation
      - capability.operational_coordination
    may_observe:
      - state.campaign_config
      - state.campaign_lifecycle
      - state.private_checkpoint
      - state.resource_admissions
      - state.integration_worktree
      - state.branch_publication
      - state.durable_history
      - artifact.campaign_preflight
      - artifact.plan
      - artifact.placement_certificate
      - artifact.implementation_receipt
      - artifact.gate_receipt
      - artifact.audit_receipt
      - artifact.handoff_receipt
      - artifact.checkpoint_receipt
      - artifact.commit_proposal
      - artifact.completion_offer
      - artifact.completion_receipt
      - artifact.worktree_allocation
      - artifact.resource_admission
      - artifact.canonical_publication
      - artifact.telemetry_ingress
      - artifact.planning_handoff
    observation_limits:
      artifact.plan: concise plan and certificate consequences, not raw exploration
      artifact.implementation_receipt: compact phase result, not diffs or test logs
      artifact.gate_receipt: configured outcomes and binding identity, not raw gate output
      artifact.telemetry_ingress: authoritative projection and provenance, not child reasoning
      artifact.planning_handoff: strategic consequences, not planner transcript
    may_mutate:
      - target: state.campaign_lifecycle
        boundary: configured state machine and accepted transitions
      - target: state.durable_history
        boundary: exactly one validated terminal receipt per run and slice
    owns:
      - state.campaign_config
      - state.campaign_lifecycle
      - state.durable_history
      - artifact.audit_receipt
      - artifact.completion_offer
    consumes:
      - artifact.campaign_preflight
      - artifact.plan
      - artifact.implementation_receipt
      - artifact.gate_receipt
      - artifact.handoff_receipt
      - artifact.telemetry_ingress
      - artifact.planning_handoff
    emits:
      - artifact.audit_receipt
      - artifact.checkpoint_receipt
      - artifact.completion_offer
    mediated_transitions:
      - transition: repository implementation
        mediated_by: role.builder
      - transition: private checkpoint mutation
        mediated_by: capability.checkpoint_lifecycle
      - transition: user-visible commit publication
        mediated_by: capability.canonical_publication
      - transition: strategic recommendation
        mediated_by: capability.strategic_reconciliation
      - transition: cross-session operational coordination
        mediated_by: capability.operational_coordination
    forbidden_from:
      - inspecting repository implementation or diffs for domain judgment
      - implementing campaign work
      - replacing builder validation with supervisor inference
      - creating user-visible commits without an explicit per-slice user decision
      - silently amending objective, work source, approval, or immutable configuration

  role.builder:
    label: Slice Builder
    objective: >-
      Own one accepted engineering slice from repository understanding through
      implementation, validation, remediation, and truthful receipts.
    context_lifetime: one slice across planning, implementation, and gate phases
    bound_by:
      - INV-001
      - INV-002
      - INV-003
      - INV-004
      - INV-006
      - INV-007
      - INV-008
      - INV-009
      - INV-010
      - INV-011
      - INV-012
      - INV-013
      - INV-014
      - INV-015
      - INV-016
      - INV-018
      - INV-020
      - INV-022
      - INV-023
      - INV-027
      - INV-030
      - INV-034
      - INV-036
      - INV-037
      - INV-038
      - INV-039
    may_invoke:
      - capability.repository_evidence
      - capability.direct_source_observation
      - capability.repository_mutation
      - capability.worktree_lifecycle
      - capability.deterministic_gate
      - capability.independent_review
    may_observe:
      - state.campaign_config
      - state.accepted_scope
      - state.repository
      - state.worktree
      - state.agent_worktree
      - state.resource_admissions
      - state.task_changes
      - state.gate
      - state.review
      - artifact.handoff_receipt
      - artifact.review_result
    may_mutate:
      - target: state.task_changes
        boundary: accepted scope and exact task-owned manifest after plan acceptance
      - target: state.agent_worktree
        boundary: assigned operation namespace and accepted task paths under current worktree allocation
    owns:
      - state.builder_context
      - artifact.plan
      - artifact.placement_certificate
      - artifact.implementation_receipt
      - artifact.gate_receipt
      - artifact.handoff_receipt
      - artifact.commit_proposal
      - artifact.worktree_allocation
    consumes:
      - state.campaign_config
      - state.accepted_scope
      - artifact.handoff_receipt
      - artifact.review_result
      - artifact.worktree_allocation
    emits:
      - artifact.plan
      - artifact.placement_certificate
      - artifact.implementation_receipt
      - artifact.gate_receipt
      - artifact.audit_receipt
      - artifact.handoff_receipt
      - artifact.checkpoint_manifest
      - artifact.commit_proposal
    mediated_transitions:
      - transition: plan acceptance
        mediated_by: role.supervisor
      - transition: private checkpoint creation or acceptance
        mediated_by: role.supervisor
      - transition: user-visible commit publication
        mediated_by: capability.canonical_publication
      - transition: durable audit append
        mediated_by: capability.receipt_finalization
    forbidden_from:
      - mutating during planning
      - silently expanding the accepted boundary
      - mutating user-owned or unattributable work
      - treating retrieval as independent review
      - weakening configured validation
      - accepting its own slice
      - directly controlling checkpoint refs or user-visible Git publication
      - mutating the ordinary human worktree or another operation's assigned worktree
      - treating a chatboard message or advisory claim as resource mutation authority

  role.independent_reviewer:
    label: Independent Reviewer
    objective: >-
      Provide fresh, read-only falsification or adversarial evidence that reduces
      correlated builder error for the bounded claim under review.
    context_lifetime: fresh at entry; isolated and bounded to one review claim or remediation loop
    bound_by:
      - INV-001
      - INV-002
      - INV-008
      - INV-012
      - INV-018
      - INV-020
      - INV-023
    may_invoke:
      - capability.reviewer_indexed_structure
      - capability.reviewer_direct_source
    may_observe:
      - state.repository
      - state.task_changes
      - state.gate
      - artifact.placement_certificate
      - artifact.gate_receipt
      - artifact.checkpoint_manifest
    may_mutate: []
    owns:
      - state.reviewer_context
      - artifact.review_result
    consumes:
      - artifact.placement_certificate
      - artifact.gate_receipt
      - artifact.checkpoint_manifest
    emits:
      - artifact.review_result
    independence:
      independent_of:
        - state.builder_context
      cannot_inspect:
        - raw builder reasoning transcript
      evidence_boundary: >-
        The reviewer observes the accepted claim, attributed changes, compact
        deterministic evidence, and only the repository context needed to
        falsify or review them.
    forbidden_from:
      - mutating repository files, worktree, index, refs, or generated artifacts
      - writing patches or implementing fixes
      - running or replacing deterministic tests and gates
      - accepting a plan or slice
      - changing campaign configuration, objective, or scope
      - treating a retrieval packet as independent observation
      - broadening review beyond task-owned changes without causal evidence

analysis_queries:
  obligation_coverage: >-
    For every bound_by and must_require invariant, find an owned, invoked, or
    mediated capability/artifact path that can establish or evidence it.
  observability_gap: >-
    Find decisions or obligations whose required state is absent from may_observe.
  authority_leak: >-
    Find may_mutate targets or capability transitions outside accepted authority.
  orphan_agency: >-
    Find invoked capabilities or mutation targets with no path to an objective,
    invariant consequence, required artifact, or downstream consumer.
  redundant_affordance: >-
    Compare capabilities that expose the same transition, evidence distinction,
    authority boundary, reversibility, and failure-isolation properties.
  procedural_drift: >-
    Find invariants that constrain a route or sequence without a route-invariant
    product failure mode.
  independence_violation: >-
    Find independent evidence paths that share builder reasoning context or
    mutation authority.
  ownership_gap: >-
    Find emitted artifacts with no lifecycle owner or downstream consumer.
